{{- if .Values.setup.enabled }}
{{- $hooks := ternary "pre-install,pre-upgrade" "pre-install" .Values.setup.onUpgrade }}
{{- if not .Values.setup.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-setup-credentials
  annotations:
    helm.sh/hook: {{ $hooks }}
    helm.sh/hook-weight: "-7"
    helm.sh/hook-delete-policy: before-hook-creation
stringData:
  {{ .Values.setup.secretKeys.username }}: {{ required "Set setup.existingSecret or global.username" .Values.global.username | quote }}
  {{ .Values.setup.secretKeys.password }}: {{ required "Set setup.existingSecret or global.password" .Values.global.password | quote }}
  {{ .Values.setup.secretKeys.mail }}: {{ .Values.global.mail | default "" | quote }}
  {{- if .Values.notifications.telegram.enabled }}
  telegram-token: {{ required "Telegram token required" .Values.notifications.telegram.bot_apitoken | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-setup
  annotations:
    helm.sh/hook: {{ $hooks }}
    helm.sh/hook-weight: "-6"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  setup.ts: |
{{ .Files.Get "config/setup/setup.ts" | indent 4 }}
  settings.json: |
    {{- $urls := dict }}
    {{- range $app := list "sonarr" "radarr" "prowlarr" "qbittorrent" "bazarr" "jellyfin" "jellyseerr" "flaresolverr" }}
    {{- $values := index $.Values $app }}
    {{- $_ := set $urls $app (printf "http://%s-%s.%s.svc.cluster.local:%v" $.Release.Name $app $.Release.Namespace $values.service.main.ports.main.port) }}
    {{- end }}
    {{- $settings := deepCopy .Values.setup }}
    {{- $_ := set $settings "urls" $urls }}
    {{- $_ := set $settings "language" .Values.global.preferredLanguage }}
    {{- $_ := set $settings "country" .Values.global.countryCode }}
    {{- $_ := set $settings "indexers" .Values.indexers }}
    {{- $_ := set $settings "bazarrSettings" .Values.bazarrSettings }}
    {{- $transcoder := deepCopy .Values.jellyfin.transcoder }}
    {{- $_ := set $transcoder "enabled" .Values.jellyfin.persistence.transcode.enabled }}
    {{- $_ := set $settings "transcoder" $transcoder }}
    {{- $_ := set $settings "telegram" (dict "enabled" .Values.notifications.telegram.enabled) }}
    {{- $_ := set $settings "vpn" .Values.qbittorrent.addons.gluetun.enabled }}
    {{- $_ := set $settings "csrf" .Values.qbittorrent.csrf_protection }}
    {{- $_ := set $settings "qbitPort" .Values.qbittorrent.service.main.ports.main.port }}
{{ $settings | toPrettyJson | indent 4 }}
---
{{- range $phase := list "prepare-qbittorrent" "configure" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-setup-{{ $phase }}
  annotations:
    helm.sh/hook: {{ if eq $phase "prepare-qbittorrent" }}{{ $hooks }}{{ else }}{{ ternary "post-install,post-upgrade" "post-install" $.Values.setup.onUpgrade }}{{ end }}
    helm.sh/hook-weight: {{ if eq $phase "prepare-qbittorrent" }}"-3"{{ else }}"10"{{ end }}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $.Values.setup.timeoutSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with $.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: {{ $.Values.setup.image | quote }}
          command: [bun, /setup/setup.ts, {{ $phase | quote }}]
          env:
            {{- include "servarr.setup.credentials" $ | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /setup
              readOnly: true
            {{- if eq $phase "prepare-qbittorrent" }}
            - name: torrent-config
              mountPath: /config
            {{- else }}
            {{- range $app := list "sonarr" "radarr" "prowlarr" "bazarr" "jellyseerr" }}
            - name: {{ $app }}-config
              mountPath: /configs/{{ $app }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: script
          configMap:
            name: {{ $.Release.Name }}-setup
        {{- if eq $phase "prepare-qbittorrent" }}
        - name: torrent-config
          persistentVolumeClaim:
            claimName: {{ $.Values.qbittorrent.persistence.config.existingClaim }}
        {{- else }}
        {{- range $app := list "sonarr" "radarr" "prowlarr" "bazarr" "jellyseerr" }}
        - name: {{ $app }}-config
          persistentVolumeClaim:
            claimName: {{ (index $.Values $app).persistence.config.existingClaim | default (printf "%s-%s-config" $.Release.Name $app) }}
        {{- end }}
        {{- end }}
---
{{- end }}
{{- end }}
