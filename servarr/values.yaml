global:
  # -- (string) Insert your storage class here, e.g.: &storageClassName network-block. Do not remove the `&storageClassName` anchor!
  # @section -- Global
  storageClassName: &storageClassName "network-block"
  # -- (string) Insert your ingress class here, e.g.: &ingressClassName nginx. Do not remove the `&ingressCassName` anchor, and do not leave the anchor value empty, otherwise you will face a `null` value error!
  # @default -- nginx
  # @section -- Global
  ingressClassName: &ingressClassName "nginx"
  # -- (string) Insert your cert manager cluster issuer, e.g.: letsencrypt-cloudflare. Do not remove the `&issuer` anchor!
  # @default -- No default value, leave empty if not required
  # @section -- Global
  certManagerClusterIssuer: &issuer ""
  # -- (string) Insert the shared Servarr username (used for Jellyfin, Seerr, and qBitTorrent admin)
  # @section -- Global
  username:
  # -- (string) Insert the shared Servarr password (used for Jellyfin, Seerr, and qBitTorrent admin)
  # @section -- Global
  password:
  # -- (string) Insert Jellyfin login mail (also used for Seerr integration)
  # @section -- Global
  mail:
  # -- (string) Insert the Jellyfin country code
  # @default -- US
  # @section -- Global
  countryCode: "US"
  # -- (string) Insert the Jellyfin preferred language
  # @default -- en
  # @section -- Global
  preferredLanguage: "en"
  # -- NodeSelector for init jobs and pre-deployment jobs. Ensures jobs run on same node as PVCs when using local-path storage.
  # @section -- Global
  # @default -- {}
  nodeSelector: {}

metrics:
  # -- Anchor to set wether to deploy the export sidecar pods or not. Requires the Prometheus stack. Do not remove the `&metricsEnabled` anchor!
  # @section -- Metrics
  enabled: &metricsEnabled false

notifications:
  telegram:
    # -- Enable the Telegram notifications
    # @section -- Seerr
    enabled: false
    chat_id:
    # -- (string) Insert your Telegram Bot API token
    # @section -- Seerr
    # @default -- No default value
    bot_apitoken:

# -- The indexers list. Each element of the list is the yaml-formatted body of the [Prowlarr API request](https://prowlarr.com/docs/api/#/Indexer/post_api_v1_indexer) to add that index.
# @default -- []
# @section -- Prowlarr
indexers: []

volumes:
  # @ignore
  storageClass: *storageClassName
  # -- Access mode for shared PVCs. Use ReadWriteOnce for local-path, ReadWriteMany for network storage
  # @section -- Storage
  accessModes:
    - ReadWriteMany
  # -- Access mode for VCT (volume claim templates). Same as accessModes if not specified
  # @section -- Storage
  vctAccessModes:
    - ReadWriteMany
  # -- configuration of the volume used for torrent downloads
  # @section -- Storage
  # @default -- See the sub fields
  downloads:
    # -- Enable creation of downloads PVC. Set to false to use hostPath instead
    # @section -- Storage
    enabled: true
    # -- Name of the download pvc. Do not remove the `&downloads-volume` anchor!
    # @section -- Storage
    name: &downloads-volume downloads-volume
    # -- Size of the downloads volume, in Kubernets format
    # @section -- Storage
    size: 100Gi
  # -- configuration of the volume used for media storage (i.e.: where movies and tv shows file will be permanently stored)
  # @section -- Storage
  # @default -- See the sub fields
  media:
    # -- Enable creation of media PVC. Set to false to use hostPath instead
    # @section -- Storage
    enabled: true
    # -- Name of the media pvc. Do not remove the `&media-volume` anchor!
    # @section -- Storage
    name: &media-volume media-volume
    # -- Size of the media volume, in Kubernets format
    # @section -- Storage
    size: 250Gi
  # -- configuration of the volume used for qBitTorrent internal configuration
  # @section -- Storage
  # @default -- See the sub fields
  torrentConfig:
    # -- Enable creation of torrent config PVC. Set to false to manage separately
    # @section -- Storage
    enabled: true
    # -- Name of the torrent configuration pvc. Do not remove the `&torrentConfig` anchor!
    # @section -- Storage
    name: &torrentConfig torrent-config
    # -- Size of the torrent configuration volume, in Kubernets format
    # @section -- Storage
    size: 1Gi

# Empty values override the common chart architecture default; Helm 4.3 removes
# null defaults before that chart merges its values.
# @ignore
sonarr:
  podOptions:
    nodeSelector: {kubernetes.io/arch: ""}
  # @ignore
  metrics:
    main:
      enabled: *metricsEnabled
  # @ignore
  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              SONARR__AUTH__METHOD: "External"
              SONARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
  # @ignore
        initContainers:
          runtime:
            enabled: true
            type: init
            imageSelector: image
            command:
              - /bin/sh
              - "-ec"
            args:
              - mkdir -p /bootstrap-runtime/s6; chmod 0700 /bootstrap-runtime/s6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsGroup: 568
              runAsNonRoot: true
              runAsUser: 568
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
  ingress:
    # @ignore
    sonarr-ing:
      enabled: true
      primary: true
      required: false
      expandObjectName: false
      annotations:
        cert-manager.io/cluster-issuer: *issuer
      ingressClassName: *ingressClassName
      hosts:
        - host: sonarr.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - sonarr.local
          secretName: sonarr-tls
      integrations:
        certManager:
          enabled: false
        traefik:
          enabled: false
  # @ignore
  persistence:
    config:
      enabled: true
      type: pvc
      size: 1Gi
      accessModes: ReadWriteMany
      storageClass: *storageClassName
      targetSelector:
        main:
          main:
            mountPath: /config
        exportarr:
          exportarr:
            mountPath: /config
            readOnly: true
    # @ignore
      targetSelectAll: false
    media:
      enabled: true
      type: pvc
      existingClaim: *media-volume
      targetSelector:
        main:
          main:
            mountPath: /mnt/media
      targetSelectAll: false
    downloads:
      enabled: true
      type: pvc
      existingClaim: *downloads-volume
      targetSelector:
        main:
          main:
            mountPath: /mnt/downloads
      targetSelectAll: false
    devshm:
      targetSelectAll: false
      targetSelector:
        main:
          main: {}
    shared:
      targetSelectAll: false
      targetSelector:
        main:
          main: {}
    tmp:
      targetSelectAll: false
      targetSelector:
        main:
          main: {}
    varlogs:
      targetSelectAll: false
      targetSelector:
        main:
          main: {}
    varrun:
      targetSelectAll: false
      targetSelector:
        main:
          main:
            mountPath: /run
            subPath: s6
          runtime:
            mountPath: /bootstrap-runtime
            subPath: ""
  image:
    repository: lscr.io/linuxserver/sonarr
    tag: version-4.0.19.2979@sha256:82172b363f9eddc02aca544f880a044f2ceb9aaf190bc87e4454e2f705eb91d0
