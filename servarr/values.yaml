jellyfin:
  podOptions:
    nodeSelector: {kubernetes.io/arch: ""}
  metrics:
    main:
      enabled: *metricsEnabled
  # @ignore
  fallbackDefaults:
    storageClass:
    probeType: http
    serviceProtocol: tcp
    serviceType: ClusterIP
    persistenceType: pvc
    pvcRetain: false
    pvcSize: 100Gi
    vctSize: 100Gi
    accessModes:
      - ReadWriteMany
    vctAccessModes:
      - ReadWriteMany
    probeTimeouts:
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
        successThreshold: 1
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
        successThreshold: 2
      startup:
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 60
        successThreshold: 1
    pgVersion: 16
  serviceProtocol: tcp
  ingress:
    jellyfin-ing:
      enabled: true
      primary: true
      required: false
      expandObjectName: false
      annotations:
        cert-manager.io/cluster-issuer: *issuer
      ingressClassName: *ingressClassName
      hosts:
        - host: jellyfin.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - jellyfin.local
          secretName: jellyfin-tls
      integrations:
        certManager:
          enabled: false
        traefik:
          enabled: false
  persistence:
    transcode:
      enabled: false
    config:
      enabled: true
      type: pvc
      size: 100Mi
      accessModes: ReadWriteMany
      storageClass: *storageClassName
      targetSelector:
        main:
          main:
            mountPath: /config
        exportarr:
          exportarr:
            mountPath: /config
            readOnly: true
    media:
      enabled: true
      type: pvc
      existingClaim: *media-volume
      targetSelector:
        main:
          main:
            mountPath: /mnt/media
  # -- Controls the optional Jellyfin transcoder bootstrap configuration. Toggled via `persistence.transcode.enabled`.
  # @section -- Jellyfin
  transcoder:
    # -- Body of the Jellyfin transcoder API request.
    body:
      EncodingThreadCount: -1
      EnableFallbackFont: false
      EnableAudioVbr: false
      DownMixAudioBoost: 2
      DownMixStereoAlgorithm: "None"
      MaxMuxingQueueSize: 2048
      EnableThrottling: false
      ThrottleDelaySeconds: 180
      EnableSegmentDeletion: false
      SegmentKeepSeconds: 720
      HardwareAccelerationType: "vaapi"
      EncoderAppPathDisplay: "/usr/lib/jellyfin-ffmpeg/ffmpeg"
      VaapiDevice: "/dev/dri/renderD128"
      QsvDevice: ""
      EnableTonemapping: false
      EnableVppTonemapping: false
      EnableVideoToolboxTonemapping: false
      TonemappingAlgorithm: "bt2390"
      TonemappingMode: "auto"
      TonemappingRange: "auto"
      TonemappingDesat: 0
      TonemappingPeak: 100
      TonemappingParam: 0
      VppTonemappingBrightness: 16
      VppTonemappingContrast: 1
      H264Crf: 23
      H265Crf: 28
      DeinterlaceDoubleRate: false
      DeinterlaceMethod: "yadif"
      EnableDecodingColorDepth10Hevc: true
      EnableDecodingColorDepth10Vp9: false
      EnableDecodingColorDepth10HevcRext: false
      EnableDecodingColorDepth12HevcRext: false
      EnableEnhancedNvdecDecoder: true
      PreferSystemNativeHwDecoder: true
      EnableIntelLowPowerH264HwEncoder: false
      EnableIntelLowPowerHevcHwEncoder: false
      EnableHardwareEncoding: true
      AllowHevcEncoding: false
      AllowAv1Encoding: false
      EnableSubtitleExtraction: true
      HardwareDecodingCodecs:
        - "h264"
        - "hevc"
      AllowOnDemandMetadataBasedKeyframeExtractionForExtensions:
        - "mkv"
      TranscodingTempPath: "/config/transcodes"  # mounted as a volume

# @ignore
  image:
    repository: ghcr.io/jellyfin/jellyfin
    tag: 12.0@sha256:74f4d87d9cf262c52d62be6be265c0355c6a7e21d0477ab6c654a49a4f8b1fd4
