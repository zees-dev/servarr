qbittorrent:
  podOptions:
    nodeSelector: {kubernetes.io/arch: ""}
  # -- Whether to enable or disable CSRF Protection on qBitTorrent WebGUI
  # @section -- Torrent
  # @default -- true
  csrf_protection: true
  metrics:
    main:
      enabled: *metricsEnabled
  # @ignore
  workload:
    main:
      podSpec:
        containers:
          main:
            env:
              QBITTORRENT__USE_PROFILE: false
  # @ignore
            command:
              - /usr/bin/tini
              - "--"
              - /bin/sh
              - "-ec"
            args:
              - "test -s /config/qBittorrent/qBittorrent.conf || { echo 'qBittorrent setup has not completed'; exit 70; }\n{{ if .Values.addons.gluetun.enabled }}\ngrep -Fqx 'Session\\Interface=tun0' /config/qBittorrent/qBittorrent.conf || { echo 'Set the existing qBittorrent network interface to tun0 before enabling VPN'; exit 71; }\nuntil curl --fail --silent --connect-timeout 2 --max-time 3 http://127.0.0.1:9999/ >/dev/null; do sleep 2; done\n{{ end }}\nexec /entrypoint.sh"
      replicas: 1
      strategy: Recreate
  ingress:
    qbittorrent-ing:
      enabled: true
      primary: true
      required: false
      expandObjectName: false
      annotations:
        cert-manager.io/cluster-issuer: *issuer
      ingressClassName: *ingressClassName
      hosts:
        - host: torrent.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - torrent.local
          secretName: torrent-tls
      integrations:
        certManager:
          enabled: false
        traefik:
          enabled: false
  # @ignore
  persistence:
    config:
      enabled: true
      type: pvc
      existingClaim: *torrentConfig
      targetSelector:
        main:
          main:
            mountPath: /config
        exportarr:
          exportarr:
            mountPath: /config
            readOnly: true
    downloads:
      enabled: true
      type: pvc
      existingClaim: *downloads-volume
      targetSelector:
        main:
          main:
            mountPath: /downloads

# @ignore
  image:
    repository: oci.trueforge.org/containerforge/qbittorrent
    tag: 5.2.3@sha256:8929ad12c4b0e7cddb77b4de7fb250c8d6b68881494fcac7679a284de0510d99
    pullPolicy: IfNotPresent
  gluetunImage:
    repository: docker.io/qmcgaw/gluetun
    tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    pullPolicy: IfNotPresent
  addons:
    gluetun:
      enabled: false
      targetSelector:
        - main
      container:
        env: null
        envList:
          - name: VPN_SERVICE_PROVIDER
            value: custom
          - name: VPN_TYPE
            value: wireguard
          - name: VPN_INTERFACE
            value: tun0
          - name: WIREGUARD_ALLOWED_IPS
            value: "0.0.0.0/0,::/0"
          - name: WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL
            value: 25s
          - name: DNS_SERVER
            value: "off"
          - name: DNS_ADDRESS
            value: "{{ .Values.vpn.dns }}"
          - name: DNS_KEEP_NAMESERVER
            value: "off"
          - name: FIREWALL
            value: "on"
          - name: FIREWALL_INPUT_PORTS
            value: "{{ .Values.service.main.ports.main.port }}"
          - name: FIREWALL_OUTBOUND_SUBNETS
            value: "{{ join \",\" .Values.vpn.allowedSubnets }}"
          - name: HEALTH_RESTART_VPN
            value: "on"
        lifecycle: null
        probes:
          startup:
            enabled: true
            type: exec
            command:
              - /gluetun-entrypoint
              - healthcheck
            spec:
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 60
              successThreshold: 1
          readiness:
            enabled: true
            type: exec
            command:
              - /gluetun-entrypoint
              - healthcheck
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 2
              successThreshold: 1
  vpn:
    endpointCIDR: ""
    endpointPort: 51820
    dns: 10.64.0.1
    allowedSubnets: []
  service:
    gluetun:
      enabled: false
