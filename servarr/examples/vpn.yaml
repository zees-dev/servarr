# Merge with your storage/credentials values. Create a Secret containing wg0.conf
# in the release namespace before installing. Replace the documentation address.
qbittorrent:
  vpn:
    endpointCIDR: 192.0.2.10/32
    endpointPort: 51820
    dns: 10.64.0.1
    # Only subnets needed for incoming Web UI/client connections; no public ranges.
    allowedSubnets: [10.42.0.0/16, 10.43.0.0/16, 192.168.1.0/24]
  podOptions:
    dnsPolicy: None
    dnsConfig:
      nameservers: [10.64.0.1]
      searches: ['{{ .Release.Namespace }}.svc.cluster.local']
      options:
        - name: ndots
          value: "1"
  addons:
    gluetun:
      enabled: true
  persistence:
    vpn-config:
      enabled: true
      type: secret
      objectName: servarr-wireguard
      expandObjectName: false
      defaultMode: "0400"
      items:
        - key: wg0.conf
          path: wg0.conf
      targetSelector:
        main:
          gluetun:
            mountPath: /gluetun/wireguard
            readOnly: true
